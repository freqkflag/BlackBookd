name: Bug report
description: Something is broken in Project BlackBookd
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Do not include real contacts, health data, or secrets** in this form.

  - type: checkboxes
    id: terms
    attributes:
      label: Agreement
      options:
        - label: I agree to follow the [Code of Conduct](../blob/main/CODE_OF_CONDUCT.md).
          required: true
        - label: I searched [existing issues](https://github.com/freqkflag/BlackBookd/issues) and did not find a duplicate.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
      placeholder: Clear steps to reproduce…
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Git commit, tag, or branch (e.g. `main`, `cursor/mature-crm-mvp-3567`).
      placeholder: commit SHA or branch name

  - type: dropdown
    id: hosting
    attributes:
      label: How are you running BlackBookd?
      options:
        - Self-hosted Docker (in-repo Dockerfile)
        - Self-hosted PHP + npm dev setup
        - Other (describe in details)

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP version, database engine, browser (if UI). **No `.env` secrets.**
      placeholder: PHP 8.3, SQLite, Firefox …

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Sanitized Laravel log excerpts or console errors only.